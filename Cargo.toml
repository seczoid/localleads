[package]
name = "localleads"
version = "0.2.3"
edition = "2024"
description = "Self-hosted Google Maps lead finder with email enrichment, a proxy checker and an MCP server for AI agents"
license = "MIT"
repository = "https://github.com/seczoid/localleads"
homepage = "https://github.com/seczoid/localleads"

[dependencies]
anyhow = "1.0"
# Accounts and MCP API keys: Argon2id password hashes, random tokens kept
# only as SHA-256 hashes, and tower-http's auth layer in front of /mcp.
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
tower-http = { version = "0.6", features = ["auth"] }
askama = "0.16"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12", features = ["form", "query", "cookie", "typed-header"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
directories = "6.0"
futures = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "socks"] }
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
webpki-roots = "1"
h3o = "0.11.1"
# Mail-server checks of found emails; off for now (`--features verify`).
check-if-email-exists = { version = "0.11.11", optional = true }
webclaw-fetch = { git = "https://github.com/0xMassi/webclaw", tag = "v0.7.4", version = "0.7.4" }
webclaw-core = { git = "https://github.com/0xMassi/webclaw", tag = "v0.7.4", version = "0.7.4", default-features = false }
regex = "1.13.1"
# Certificate checks for the Google clients, which build their own TLS
# config (see scraper::google_tls).
rustls-platform-verifier = "0.7.1"
# In-app updates: release versions, and unpacking the downloaded archive.
semver = "1"
# Unpacks the bundled place data (world.rs) and, off Windows, update archives.
flate2 = "1"

[target.'cfg(not(windows))'.dependencies]
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# rquickjs-sys (pulled in by webclaw) ships no prebuilt bindings for Windows
# on ARM, so generate them there.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
rquickjs-sys = { version = "0.9", features = ["bindgen"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[dev-dependencies]
tempfile = "3.23"

# SQLite does the heavy lifting for large lead tables; keep it optimized even
# in debug builds.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[features]
default = []
# Check each found email with its mail server (Reacher).
verify = ["dep:check-if-email-exists"]
