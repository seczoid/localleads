{% extends "base.html" %}
{% block title %}Searches{% endblock %}
{% block heading %}<h1>Searches</h1>{% endblock %}
{% block actions %}<a class="btn primary" href="/jobs/new">New search</a>{% endblock %}
{% block content %}
<section class="card">
  <form class="toolbar" hx-get="/partials/jobs" hx-target="#jobs-table" hx-trigger="change" hx-push-url="false">
    <label class="field inline">
      <span>Status</span>
      <select name="status" id="jobs-status">
        {% for opt in status_options %}<option value="{{ opt.value }}" {% if opt.selected %}selected{% endif %}>{{ opt.label }}</option>{% endfor %}
      </select>
    </label>
    <div class="spacer"></div>
    <a class="btn" href="/leads/export.csv" hx-boost="false">Export all leads (CSV)</a>
  </form>
  <div id="jobs-table" hx-get="/partials/jobs" hx-include="#jobs-status" hx-trigger="jobs-changed from:body">
    {% include "partials/jobs_table.html" %}
  </div>
</section>
{% endblock %}
