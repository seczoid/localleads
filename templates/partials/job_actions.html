<div class="row-actions">
  {% if job.can_pause %}<button class="btn sm" hx-post="/jobs/{{ job.id }}/pause">Pause</button>{% endif %}
  {% if job.can_resume %}<button class="btn sm primary" hx-post="/jobs/{{ job.id }}/pause">Resume</button>{% endif %}
  {% if job.can_stop %}<button class="btn sm danger" hx-post="/jobs/{{ job.id }}/stop" hx-confirm="Stop this search? Collected leads are kept.">Stop</button>{% endif %}
  {% if !job.active %}
  <div class="menu-wrap" x-data="dropdown()" @click.outside="open = false" @scroll.window.capture="open = false" @resize.window="open = false">
    <button type="button" class="btn sm ghost" x-ref="button" @click="toggle()" :aria-expanded="open" aria-label="More actions">•••</button>
    <div class="menu floating" x-ref="menu" x-show="open" x-cloak x-transition.opacity @click="open = false">
      <button hx-post="/jobs/{{ job.id }}/rerun" hx-confirm="Run a new search with the same settings?">Run again</button>
      <a href="/jobs/new?from={{ job.id }}">Duplicate and edit</a>
      <a href="/leads?job={{ job.id }}">View leads</a>
      <a href="/leads/export.csv?job={{ job.id }}" hx-boost="false">Export CSV</a>
      <hr>
      <button class="danger" hx-post="/jobs/{{ job.id }}/delete" hx-confirm="Delete this search? Its leads are kept.">Delete search</button>
      <button class="danger" hx-post="/jobs/{{ job.id }}/delete?leads=1" hx-confirm="Delete this search and the leads only it found? Leads other searches also found are kept. This cannot be undone.">Delete search and its leads</button>
    </div>
  </div>
  {% endif %}
</div>
